name: Deploy production (manual)

on:
  workflow_dispatch:

concurrency:
  group: wingedhorse-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Upload reviewed candidate
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/opt/wingedhorse/live"
      - name: Build and start reviewed candidate
        uses: appleboy/ssh-action@v1
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_CHAT_MODEL: ${{ secrets.OPENROUTER_CHAT_MODEL }}
          OPENROUTER_SUMMARY_MODEL: ${{ secrets.OPENROUTER_SUMMARY_MODEL }}
          OPENROUTER_VISION_MODEL: ${{ secrets.OPENROUTER_VISION_MODEL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: OPENROUTER_API_KEY,OPENROUTER_CHAT_MODEL,OPENROUTER_SUMMARY_MODEL,OPENROUTER_VISION_MODEL
          script: |
            set -euo pipefail
            cp /opt/wingedhorse/manual/.env.production /opt/wingedhorse/live/.env.production
            # 仅当 GitHub secret 非空时覆盖，否则保留服务器默认值
            [ -n "${OPENROUTER_API_KEY}" ] && sed -i "s|^OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=${OPENROUTER_API_KEY}|" /opt/wingedhorse/live/.env.production
            [ -n "${OPENROUTER_CHAT_MODEL}" ] && sed -i "s|^OPENROUTER_CHAT_MODEL=.*|OPENROUTER_CHAT_MODEL=${OPENROUTER_CHAT_MODEL}|" /opt/wingedhorse/live/.env.production
            [ -n "${OPENROUTER_SUMMARY_MODEL}" ] && sed -i "s|^OPENROUTER_SUMMARY_MODEL=.*|OPENROUTER_SUMMARY_MODEL=${OPENROUTER_SUMMARY_MODEL}|" /opt/wingedhorse/live/.env.production
            [ -n "${OPENROUTER_VISION_MODEL}" ] && sed -i "s|^OPENROUTER_VISION_MODEL=.*|OPENROUTER_VISION_MODEL=${OPENROUTER_VISION_MODEL}|" /opt/wingedhorse/live/.env.production
            [ -n "${OPENROUTER_API_KEY}" ] && sed -i "s|^OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=${OPENROUTER_API_KEY}|" /opt/wingedhorse/manual/.env.production
            mkdir -p /opt/wingedhorse/live/deploy/cert
            cp -R /opt/wingedhorse/manual/cert/https /opt/wingedhorse/live/deploy/cert/ 2>/dev/null || true
            cd /opt/wingedhorse/live/deploy
            docker compose --env-file ../.env.production -f docker-compose.prod.yml config --quiet
            docker compose --env-file ../.env.production -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps
            curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:8080/api/health
