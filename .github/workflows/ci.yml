name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wingedhorse_test
          POSTGRES_USER: wingedhorse
          POSTGRES_PASSWORD: wingedhorse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wingedhorse -d wingedhorse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://wingedhorse:wingedhorse_test@127.0.0.1:5432/wingedhorse_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate production Compose
        run: |
          cp deploy/.env.production.example .env.production
          docker compose --env-file .env.production -f deploy/docker-compose.prod.yml config --quiet
      - run: pnpm --filter @wingedhorse/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Verify production offline route cache
        run: pnpm test:e2e:production-sw
