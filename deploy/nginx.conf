# WingedHorse 生产 nginx（共存部署：宿主 80/443 已被 VibeShot 占用，改用 8080/8443）
# 当前为 HTTP-only 过渡配置；拿到 wingedhorse.leisuremaking.cn 证书后，
# 在 8443 上启用 TLS（见 docs/DEPLOYMENT.md「域名与 TLS」章节），并把 8080 改回 301 跳转。

limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=agent:10m rate=2r/s;

server {
  listen 8080;
  server_name _;

  # Phaser and route chunks are large; gzip cuts first-open wait on mobile networks.
  # 服务器公网带宽仅 ~1Mbps 且 nginx 限 0.25 核：优先用构建期预压缩的 .gz，
  # 避免每次请求现场压缩 1.37MB 的 Phaser 分片把 CPU 打满。
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    image/svg+xml;

  location = /healthz { access_log off; return 200 "ok\n"; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # camera/microphone 仅允许本源、且须由用户手势触发；地理定位保持关闭。
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  client_max_body_size 32k;
  client_body_timeout 10s;
  client_header_timeout 10s;

  location = /api/companion/messages/stream {
    limit_req zone=agent burst=4 nodelay;
    proxy_pass http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_buffering off;
    proxy_cache off;
  }

  location /api/companion/ {
    limit_req zone=agent burst=4 nodelay;
    proxy_pass http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
  }

  location ~ ^/api/devices/.+/events$ {
    proxy_pass http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
  }

  location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    proxy_pass http://api:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
  }

  location ^~ /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # 游戏/场景/品牌图片和字体：内容稳定但路径未带哈希，给 30 天缓存；
  # 否则每次进游戏都重新下载 ~300KB 图片，在 1Mbps 带宽下首开超过 15 秒。
  # 作用域限定在静态图库目录与根级图标，避免未来以图片扩展名结尾的 /api/ 路由被劫持到静态目录
  location ~* ^/((game|scene|brands)/.+|[^/]+)\.(webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location / {
    root /usr/share/nginx/html;
    # 不用 $uri/：dist 里存在 /game、/scene 等物理目录，
    # 会把同名 SPA 路由（如 /game）重定向到目录索引并返回 403。
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
