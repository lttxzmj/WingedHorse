services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wingedhorse
      POSTGRES_USER: wingedhorse
      POSTGRES_PASSWORD: wingedhorse
    ports:
      - "5432:5432"
    volumes:
      - wingedhorse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wingedhorse"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wingedhorse_postgres:
